name: Fetch filtered funds

on:
  workflow_dispatch:   # รันเองด้วยปุ่ม Run workflow

permissions:
  contents: write      # ให้ workflow commit ไฟล์ผลลัพธ์กลับเข้า repo ได้

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and filter
        env:
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}   # เปลี่ยนชื่อ secret ให้ตรงกับที่ตั้งไว้
        run: python fetch_filtered_funds.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add filtered_funds.json filtered_funds.csv || true
          git diff --cached --quiet || git commit -m "Update filtered funds data"
          git push
