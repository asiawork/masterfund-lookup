<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Fund Lookup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #13294B;
    --text: #1C2738;
    --muted: #6B7A90;
    --line: #DDE3EC;
    --lotus: #2A5CAA;
    --wash: #F3F6FB;
    --hover: #E7EAEF;
    --mark: #FFE9A8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #F7F8FA; color: var(--text);
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", Tahoma, sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
  header.wrap { padding-top: 40px; padding-bottom: 8px; }
  h1 { margin: 0; font-size: 34px; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; line-height: 1.2; }
  h1 a { color: inherit; text-decoration: none; border-radius: 6px; }
  h1 a:hover { opacity: .8; }
  h1 a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  .sub { margin: 2px 0 20px; color: var(--muted); }

  /* ---------- combobox ---------- */
  .combo { position: relative; }
  .field {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 0 16px; box-shadow: 0 1px 2px rgba(19,41,75,.06);
  }
  .field:focus-within { border-color: var(--lotus); box-shadow: 0 0 0 3px rgba(42,92,170,.15); }
  .field svg { flex: none; color: var(--muted); }
  .field input {
    flex: 1; border: 0; outline: none; background: none; font: inherit; font-size: 18px;
    padding: 16px 0; color: var(--text); min-width: 0;
  }
  .clear {
    flex: none; width: 24px; height: 24px; border-radius: 50%; border: 0; cursor: pointer;
    background: #6B7A90; color: #fff; font-size: 14px; line-height: 24px; padding: 0;
  }
  .clear:focus-visible { outline: 2px solid var(--lotus); outline-offset: 2px; }

  .dropdown {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 10;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 12px 32px rgba(19,41,75,.14); max-height: min(460px, 55vh); max-height: min(460px, 55dvh); overflow-y: auto; -webkit-overflow-scrolling: touch;
    list-style: none; margin: 0; padding: 6px 0;
  }
  .group-label { padding: 10px 20px 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .opt { padding: 10px 20px; cursor: pointer; }
  .opt[aria-selected="true"] { background: var(--hover); }
  .opt .t { font-weight: 700; color: var(--ink); font-size: 16px; line-height: 1.4; }
  .opt .d { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt-empty { padding: 14px 20px; color: var(--muted); }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }

  .head-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
  .stats { color: var(--muted); font-size: 13px; padding-top: 6px; white-space: nowrap; }

  /* ---------- result ---------- */
  main.wrap { padding-top: 24px; padding-bottom: 60px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  .detail h2 { margin: 0; font-size: 22px; color: var(--ink); line-height: 1.35; }
  .to-master { color: var(--lotus); font-weight: 500; }
  a.ext { color: inherit; text-decoration: none; }
  a.ext svg { margin-left: 8px; vertical-align: -2px; color: var(--lotus); }
  a.ext:hover { color: var(--lotus); text-decoration: underline; text-underline-offset: 4px; }
  a.ext:focus-visible { outline: 2px solid var(--lotus); outline-offset: 3px; border-radius: 4px; }
  .meta { color: var(--muted); margin: 6px 0 18px; font-size: 14px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .btn {
    font: inherit; font-size: 14px; padding: 7px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--lotus); background: #fff; color: var(--lotus);
  }
  .btn:hover { background: var(--wash); }
  .btn:focus-visible { outline: 2px solid var(--lotus); outline-offset: 2px; }

  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; min-width: 760px; }
  th, td { padding: 12px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { background: var(--wash); font-size: 13px; font-weight: 600; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  tr.hit td { background: #FFFBEA; }
  .abbr { font-weight: 700; color: var(--ink); }
  .small { color: var(--muted); font-size: 13px; }
  .amc { font-weight: 600; }
  table { table-layout: fixed; }
  .c-fund { width: 30%; } .c-amc { width: 14%; } .c-cls { width: 22%; } .c-st { width: 16%; } .c-fx { width: 18%; }
  td.c-fund .abbr, td.c-amc .amc { font-size: 16px; line-height: 1.5; }
  .cls { font-size: 15px; line-height: 1.5; padding: 0; }
  .cls + .cls { margin-top: 6px; }
  .tax { font-size: 11.5px; color: var(--lotus); border: 1px solid #C9D7EE; border-radius: 4px; padding: 0 5px; margin-left: 4px; vertical-align: 1px; }
  td.c-fx, td.c-st { font-size: 15px; }
  .code { font-weight: 600; color: var(--ink); margin-right: 4px; }
  /* hover / tap for full wording */
  .tip { cursor: help; border-bottom: 1px dotted #9AA8BD; outline: none; }
  .tip:focus-visible { outline: 2px solid var(--lotus); outline-offset: 2px; border-radius: 2px; }
  #tipbox {
    position: fixed; z-index: 50; max-width: 300px; padding: 9px 12px; border-radius: 8px;
    background: var(--ink); color: #fff; font-size: 13px; line-height: 1.55;
    box-shadow: 0 8px 24px rgba(19,41,75,.25); pointer-events: none;
  }
  .variants { margin-top: 18px; font-size: 13px; color: var(--muted); }
  .variants ul { margin: 6px 0 0; padding-left: 18px; }

  .top h2 { margin: 0 0 12px; font-size: 17px; color: var(--ink); }
  .top-list { list-style: none; margin: 0; padding: 0; }
  .top-list button {
    display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left;
    font: inherit; color: var(--text); background: none; border: 0; border-top: 1px solid var(--line);
    padding: 11px 4px; cursor: pointer;
  }
  .top-list li:first-child button { border-top: 0; }
  .top-list button:hover { background: var(--wash); }
  .top-list button:focus-visible { outline: 2px solid var(--lotus); outline-offset: -2px; }
  .count { flex: none; color: var(--lotus); font-weight: 600; }

  .top-list .nm { min-width: 0; }
  .top-list .mn { display: block; }
  .top-list .nm .small { display: block; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top-list .count { font-size: 14px; padding-top: 1px; }

  /* A–Z jump bar + letter sections */
  .az-bar {
    position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 2px;
    background: #fff; padding: 8px 0; margin: 0 0 4px; border-bottom: 1px solid var(--line);
  }
  .az-bar button, .az-bar span {
    min-width: 30px; height: 30px; padding: 0 6px; border-radius: 6px; font: inherit; font-size: 14px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .az-bar button { border: 0; background: none; color: var(--lotus); cursor: pointer; }
  .az-bar button:hover { background: var(--wash); }
  .az-bar button[aria-pressed="true"] { background: var(--lotus); color: #fff; }
  .az-bar button[data-letter=""] { padding: 0 10px; font-weight: 500; }
  .home-count { font-size: 13.5px; color: var(--muted); margin: 8px 4px 4px; }
  .style-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin: 2px 0 6px; }
  .style-lbl { font-size: 13.5px; color: var(--muted); }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 14px; font-weight: 500; padding: 6px 12px; border: 0; border-left: 1px solid var(--line);
    background: #fff; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .seg button:first-child { border-left: 0; }
  .seg button .n { font-size: 12px; color: var(--muted); font-weight: 400; }
  .seg button:hover:not(:disabled) { background: var(--wash); }
  .seg button[aria-pressed="true"] { background: var(--lotus); color: #fff; }
  .seg button[aria-pressed="true"] .n { color: rgba(255,255,255,.8); }
  .seg button:disabled { color: #C3CBD8; cursor: default; }
  .seg button:focus-visible { outline: 2px solid var(--lotus); outline-offset: -2px; }
  .az-bar button:focus-visible { outline: 2px solid var(--lotus); outline-offset: 1px; }
  .az-bar span { color: #C3CBD8; }
  .note { font-size: 12.5px; color: var(--muted); margin: 0 0 6px; }

  .upload { text-align: center; }

  /* ---------- list + filter sidebar ---------- */
  .browse2 { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; align-items: start; }
  .side { position: sticky; top: 12px; padding: 16px 16px 10px; max-height: calc(100vh - 24px); overflow-y: auto; }
  .side-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; color: var(--ink); font-size: 16px; }
  .fs { border: 0; border-top: 1px solid var(--line); margin: 0; padding: 10px 0 8px; }
  .fs legend { padding: 0; margin-bottom: 4px; font-size: 13px; font-weight: 600; color: var(--muted); float: left; width: 100%; }
  .fs legend + * { clear: both; }
  .opt-row { display: flex; align-items: center; gap: 8px; padding: 4px 2px; cursor: pointer; border-radius: 6px; font-size: 14.5px; line-height: 1.35; }
  .opt-row:hover { background: var(--wash); }
  .opt-row input { margin: 0; width: 16px; height: 16px; accent-color: var(--lotus); flex: none; }
  .opt-row .ol { flex: 1; min-width: 0; }
  .opt-row .on { color: var(--muted); font-size: 12.5px; }
  .opt-row.zero { color: #A9B3C2; }
  .side-note { font-size: 12px; color: var(--muted); margin: 8px 0 4px; line-height: 1.5; }
  .listcard { padding: 16px 18px; }
  .list-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .list-top .home-count { margin: 0; flex: 1; font-size: 14px; color: var(--text); }
  .sortlbl { display: inline-flex; align-items: center; gap: 6px; }
  .filter-btn, .side-done { display: none; }
  .browse2 .active-bar { margin: 10px 0 4px; min-height: 0; }
  .tag-detail { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: -4px 0 18px;
                font-size: 13.5px; line-height: 1.5; }
  .tag-detail dt { color: var(--muted); }
  .similar { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
  .similar h3 { margin: 0; font-size: 17px; color: var(--ink); }
  .similar > .small { margin: 2px 0 8px; }
  .why { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .why span { font-size: 12px; color: #8A5A00; background: #FFF4D6; border-radius: 4px; padding: 2px 7px; }
  .why span::before { content: "✓ "; }
  .tag-detail dd { margin: 0; color: var(--text); }
  .row-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tg { font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px; background: #E3EBF7; color: var(--ink); font-weight: 500; }
  .tg-m { background: #F0F2F5; color: #4A5568; }
  .kv { display: flex; flex-wrap: wrap; gap: 4px 22px; margin-top: 7px; font-size: 13px; color: var(--text); }
  .kv i { font-style: normal; color: var(--muted); margin-right: 6px; }
  @media (max-width: 820px) {
    .browse2 { grid-template-columns: 1fr; gap: 10px; }
    .side { display: none; position: static; max-height: none; order: 0; }
    .side.open { display: block; }
    .filter-btn { display: inline-block; }
    .side-done { display: block; width: 100%; margin: 6px 0 8px; background: var(--lotus); color: #fff; }
    .list-top .home-count { flex-basis: 100%; order: 3; }
  }

  /* ---------- browse by category ---------- */
  .browse h2 { margin: 0 0 4px; font-size: 17px; color: var(--ink); }
  .browse .lead { margin: 0 0 16px; color: var(--muted); font-size: 13.5px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .tile {
    font: inherit; text-align: left; cursor: pointer; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; padding: 12px 14px; color: var(--ink); display: flex; flex-direction: column; gap: 2px;
  }
  .tile b { font-size: 15.5px; font-weight: 600; }
  .tile .n { font-size: 12.5px; color: var(--muted); }
  .tile:hover { border-color: var(--lotus); background: var(--wash); }
  .tile[aria-pressed="true"] { background: var(--lotus); border-color: var(--lotus); color: #fff; }
  .tile[aria-pressed="true"] .n { color: rgba(255,255,255,.85); }
  .tile:focus-visible { outline: 2px solid var(--lotus); outline-offset: 2px; }
  .facet { padding: 10px 0; border-top: 1px solid var(--line); }
  .facet-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13.5px; color: var(--muted); font-weight: 500; }
  .facet-h input {
    margin-left: auto; font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--line);
    border-radius: 6px; width: 170px; max-width: 45%;
  }
  .facet-h input:focus { outline: none; border-color: var(--lotus); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: inherit; font-size: 13.5px; padding: 4px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--ink); display: inline-flex; gap: 6px; align-items: center;
  }
  .chip .n { font-size: 11.5px; color: var(--muted); }
  .chip:hover { border-color: var(--lotus); }
  .chip[aria-pressed="true"] { background: var(--lotus); border-color: var(--lotus); color: #fff; }
  .chip[aria-pressed="true"] .n { color: rgba(255,255,255,.85); }
  .chip:focus-visible { outline: 2px solid var(--lotus); outline-offset: 2px; }
  .chip.more { border-style: dashed; color: var(--lotus); }
  .active-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 12px; min-height: 30px; }
  .active-bar .lbl { font-size: 13px; color: var(--muted); margin-right: 2px; }
  .pill {
    font: inherit; font-size: 13px; padding: 3px 6px 3px 10px; border-radius: 999px; cursor: pointer;
    border: 0; background: #E3EBF7; color: var(--ink); display: inline-flex; gap: 6px; align-items: center;
  }
  .pill span { font-size: 12px; color: var(--muted); }
  .pill:hover { background: #D3E0F3; }
  .linkbtn { font: inherit; font-size: 13px; border: 0; background: none; color: var(--lotus); cursor: pointer; padding: 3px 4px; }
  .linkbtn:hover { text-decoration: underline; }
  .linkbtn.jump { margin-left: auto; font-weight: 600; }
  .res-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
              margin: 14px 0 4px; padding-top: 12px; border-top: 1px solid var(--line); }
  .res-head .home-count { margin: 0; }
  .sortsel { font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
  .tagline { display: block; margin-top: 3px; font-size: 12.5px; color: var(--muted); white-space: normal; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 16px; }
  .tags .chip { font-size: 12.5px; padding: 2px 9px; }
  .tags .lbl { font-size: 12.5px; color: var(--muted); align-self: center; }

  /* ---------- mobile ---------- */
  @media (max-width: 640px) {
    .wrap { padding: 0 14px; }
    header.wrap { padding-top: 20px; padding-bottom: 4px; }
    h1 { font-size: 26px; }
    .sub { font-size: 14px; margin-bottom: 14px; }
    .field input { font-size: 16px; padding: 14px 0; }   /* 16px+ stops iOS from zooming in */
    .opt { padding: 12px 16px; }
    .group-label { padding: 10px 16px 4px; }
    main.wrap { padding-top: 16px; padding-bottom: 40px; }
    .card { padding: 16px; border-radius: 10px; }
    .detail h2 { font-size: 19px; }
    .toolbar .btn { flex: 1; padding: 10px 12px; }

    /* table becomes stacked cards */
    .table-scroll { overflow: visible; border: 0; }
    table { min-width: 0; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tr { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; padding: 6px 0; }
    tr.hit { background: #FFFBEA; }
    tr.hit td { background: none; }
    td { border: 0; padding: 6px 14px; }
    td[data-label]::before { content: attr(data-label); display: block; font-size: 12px; color: var(--muted); }
    table { table-layout: auto; }
    .c-fund, .c-amc, .c-cls, .c-st, .c-fx { width: 100%; }
    .head-row { flex-direction: column; gap: 2px; margin-bottom: 14px; }
    .stats { padding-top: 0; }
    .top-list button { padding: 12px 2px; }
    .az-bar { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px 4px; padding: 8px 12px; -webkit-overflow-scrolling: touch; }
    .az-bar button, .az-bar span { flex: none; min-width: 34px; height: 34px; }
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header class="wrap">
  <div class="head-row">
    <h1><a href="?" id="home" title="กลับหน้าแรก">Master Fund Search</a></h1>
    <div class="stats" id="stats">กำลังโหลดข้อมูล…</div>
  </div>

  <div class="combo" id="combo">
    <div class="field">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false"
             placeholder="ระบุชื่อ Master Fund ที่ต้องการ หรือค้นหาจากกองทุนในไทย"
             role="combobox" aria-expanded="false" aria-controls="dd" aria-autocomplete="list" aria-label="ค้นหา master fund หรือกองทุนไทย">
      <button class="clear hidden" id="clear" type="button" aria-label="ล้างคำค้น">✕</button>
    </div>
    <ul class="dropdown hidden" id="dd" role="listbox"></ul>
  </div>
</header>

<main class="wrap">
  <div id="upload" class="card upload hidden">
    <p>โหลดข้อมูลอัตโนมัติไม่ได้ (มักเกิดเมื่อเปิดไฟล์จากเครื่องโดยตรง)</p>
    <p>เลือกไฟล์ <b>funds_data.json</b> เพื่อเริ่มใช้งาน</p>
    <input type="file" id="file" accept=".json,.csv" multiple>
  </div>
  <section id="result" aria-live="polite"></section>
</main>

<div id="tipbox" class="hidden" role="tooltip"></div>

<script>
const DATA_URL = "funds_data.json";
const AMC_URL  = "amc_abbr.csv";
const TAGS_URL = "master_tags.csv";
const MAX_MASTERS = 8, MAX_FUNDS = 6;

let MASTERS = [], MASTER_BY_KEY = new Map(), FUNDS = [], AMC = new Map();
let items = [], active = -1;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").toLowerCase().replace(/[–—]/g, "-").replace(/[^\p{L}\p{N}]+/gu, " ").trim();
const clean = v => { const s = String(v ?? "").trim(); return ["", "none", "nan", "null"].includes(s.toLowerCase()) ? "" : s; };
// strip Thai/English label prefixes some AMCs type into the master fund field, e.g. "ชื่อกองทุนหลัก : iShares ..."
const cleanMaster = v => clean(v)
  .replace(/^\s*(ชื่อ\s*)?กองทุน\s*(หลัก)?\s*[:：]\s*/i, "")
  .replace(/^\s*(name\s+of\s+)?master\s*fund\s*(name)?\s*[:：]\s*/i, "")
  .trim();

// ---------- AMC abbreviation ----------
const amcKey = s => String(s ?? "")
  .replace(/บริษัท|หลักทรัพย์|จัดการกองทุนรวม|จัดการกองทุน|จำกัด|\(มหาชน\)|มหาชน|\(ประเทศไทย\)|ประเทศไทย/g, "")
  .replace(/[\s()]/g, "").toLowerCase();
const amcShortTh = s => String(s ?? "")
  .replace(/^บริษัท\s*หลักทรัพย์\s*จัดการกองทุน(รวม)?\s*/, "").replace(/\s*จำกัด.*$/, "").trim();

function parseAmc(text) {
  text.replace(/^\uFEFF/, "").split(/\r?\n/).slice(1).forEach(line => {
    const [abbr, ...rest] = line.split(",");
    const name = rest.join(",").replace(/^"|"$/g, "").trim();
    if (abbr && name) AMC.set(amcKey(name), abbr.trim());
  });
}

  .replace(/[^A-Z0-9]+/g, "");   // no spaces, same style as the list (e.g. FIRSTPLUS)

function init(rows) {
  rows.forEach(r => { if (clean(r.comp_name_en)) AMC_EN.set(amcKey(r.comp_name_th), clean(r.comp_name_en)); });
  const map = new Map();
  for (const r of rows) {
    const name = cleanMaster(r.Master_Fund_Search) || cleanMaster(r.feederfund_master_fund);
    if (!name) continue;
    const gk = clean(r.Master_Fund_Key) || norm(name);   // group key built in master_names.py
    if (!map.has(gk)) map.set(gk, { gk, name, rows: [], variants: new Set(), countries: new Set() });
    const m = map.get(gk);
    m.rows.push(r);
    if (clean(r.feederfund_master_fund)) m.variants.add(clean(r.feederfund_master_fund));
    if (clean(r.feederfund_country)) m.countries.add(clean(r.feederfund_country));
  }
  MASTERS = [...map.values()].map(m => {
    const projs = new Map();
    m.rows.forEach(r => { const k = r.proj_id || r.proj_abbr_name; if (!projs.has(k)) projs.set(k, r); });
    const amcs = [...new Set([...projs.values()].map(r => amcAbbr(r.comp_name_th)))].sort();
    // Active / Passive / … of each Thai feeder, from its SEC management_style code
    const styles = [...new Set([...projs.values()].map(r => styleGroup(r.management_style)))];
    // search text covers every spelling the AMCs used, so an old spelling still finds the group
    const key = norm([m.name, ...m.variants].join(" "));
    const tag = TAGS.get(norm(m.name)) || [...m.variants].map(v => TAGS.get(norm(v))).find(Boolean) || UNTAGGED;
    return { ...m, key, projects: projs.size, amcs, styles, tag };
  }).sort((a, b) => b.projects - a.projects || a.name.localeCompare(b.name));
  MASTER_BY_KEY = new Map();
  MASTERS.forEach(m => [m.name, ...m.variants].forEach(v => {
    const k = norm(v); if (!MASTER_BY_KEY.has(k)) MASTER_BY_KEY.set(k, m);
  }));
  // home list buttons carry the display name
  MASTERS.forEach(m => MASTER_BY_KEY.set(norm(m.name), m));

  // Thai funds (one entry per project, searchable by abbr, class names, Thai/English names)
  const fmap = new Map();
  for (const m of MASTERS) for (const r of m.rows) {
    const k = r.proj_id || r.proj_abbr_name;
    if (!fmap.has(k)) fmap.set(k, { abbr: clean(r.proj_abbr_name), nameTh: clean(r.proj_name_th), master: m, classes: new Set(), amc: amcAbbr(r.comp_name_th),
                                    extra: [r.proj_name_en] });
    const f = fmap.get(k);
    if (clean(r.Search_Name)) f.classes.add(clean(r.Search_Name));
  }
  FUNDS = [...fmap.values()].map(f => ({ ...f, key: norm([f.abbr, ...f.classes, f.nameTh, ...f.extra].join(" ")) }));

  const amcCount = new Set(rows.map(r => r.comp_name_th)).size;
  const lastUpd = rows.map(r => String(r.last_upd_date || "")).sort().pop() || "";
  const d = lastUpd ? new Date(lastUpd.slice(0, 10)) : null;
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  $("stats").textContent = d && !isNaN(d) ? `ข้อมูล SEC ล่าสุด ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}` : "";
  $("stats").title = `Master fund ${MASTERS.length.toLocaleString()} กอง · กองทุนไทย ${FUNDS.length.toLocaleString()} กอง จาก ${amcCount} บลจ.`;

  const p = new URLSearchParams(location.search).get("master");
  const m = p && MASTER_BY_KEY.get(norm(p));
  if (m) { history.replaceState({ view: "master" }, "", location.href); input.value = m.name; $("clear").classList.remove("hidden"); showMaster(m, null); }
  else showHome();
}

// ---------- combobox ----------
const input = $("q"), dd = $("dd");

function highlight(text, tokens) {
  // one pass over the raw text, so a later word can never match inside an earlier <mark> tag
  let ts = tokens.filter(Boolean);
  if (ts.length > 1) ts = ts.filter(t => t.length > 1);          // skip single letters like "a" when typing several words
  ts = [...new Set(ts)].sort((a, b) => b.length - a.length)
        .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!ts.length) return esc(text);
  const re = new RegExp(`(${ts.join("|")})`, "gi");
  return String(text ?? "").split(re).map((part, i) => i % 2 ? `<mark>${esc(part)}</mark>` : esc(part)).join("");
}

function buildItems(q) {
  const tokens = norm(q).split(" ").filter(Boolean);
  if (!tokens.length) return { tokens, list: [] };
  const full = norm(q);
  const masters = MASTERS.filter(m => tokens.every(t => m.key.includes(t)))
    .sort((a, b) => (b.key.startsWith(full) - a.key.startsWith(full)) || b.projects - a.projects)
    .slice(0, MAX_MASTERS);
  const funds = FUNDS.filter(f => tokens.every(t => f.key.includes(t)))
    .sort((a, b) => (norm(b.abbr).startsWith(full) - norm(a.abbr).startsWith(full)) || a.abbr.localeCompare(b.abbr))
    .slice(0, MAX_FUNDS);
  return { tokens, list: [...masters.map(m => ({ type: "master", m })), ...funds.map(f => ({ type: "fund", f }))] };
}

function renderDropdown() {
  const q = input.value;
  $("clear").classList.toggle("hidden", !q);
  const { tokens, list } = buildItems(q);
  items = list; active = list.length ? 0 : -1;
  if (!q.trim()) return closeDropdown();

  let html = "", lastType = null;
  list.forEach((it, i) => {
    if (it.type !== lastType) {
      html += `<li class="group-label" role="presentation">${it.type === "master" ? "Master fund" : "กองทุนไทย"}</li>`;
      lastType = it.type;
    }
    if (it.type === "master") {
      const m = it.m;
      html += `<li class="opt" role="option" id="opt${i}" data-i="${i}">
        <div class="t">${highlight(m.name, tokens)}</div>
        <div class="d">กองทุนไทย ${m.projects} กอง · ${esc(m.amcs.join(", "))}</div></li>`;
    } else {
      const f = it.f;
      html += `<li class="opt" role="option" id="opt${i}" data-i="${i}">
        <div class="t">${highlight(f.abbr, tokens)} <span class="small" style="font-weight:500">${esc(f.amc)}</span></div>
        <div class="d">ลงทุนใน <span class="to-master">${esc(f.master.name)} ›</span></div></li>`;
    }
  });
  if (!list.length) html = `<li class="opt-empty">ไม่พบ “${esc(q)}” ลองพิมพ์ให้สั้นลง เช่น ชื่อบริษัทจัดการต่างประเทศ หรือคำหลักของกองทุน</li>`;
  dd.innerHTML = html;
  dd.classList.remove("hidden");
  input.setAttribute("aria-expanded", "true");
  paintActive();
}

function paintActive() {
  dd.querySelectorAll(".opt").forEach(el => el.setAttribute("aria-selected", +el.dataset.i === active));
  const el = $("opt" + active);
  if (el) { el.scrollIntoView({ block: "nearest" }); input.setAttribute("aria-activedescendant", el.id); }
  else input.removeAttribute("aria-activedescendant");
}

function closeDropdown() {
  dd.classList.add("hidden");
  input.setAttribute("aria-expanded", "false");
  input.removeAttribute("aria-activedescendant");
}

input.addEventListener("input", renderDropdown);
const isPhone = () => window.matchMedia("(max-width: 640px)").matches;
input.addEventListener("focus", () => {
  if (input.value.trim()) renderDropdown();
  if (isPhone()) setTimeout(() => $("combo").scrollIntoView({ block: "start", behavior: "smooth" }), 250);
});
input.addEventListener("keydown", e => {
  if (dd.classList.contains("hidden") && e.key === "ArrowDown") { renderDropdown(); return; }
  if (e.key === "ArrowDown") { e.preventDefault(); if (items.length) { active = (active + 1) % items.length; paintActive(); } }
  else if (e.key === "ArrowUp") { e.preventDefault(); if (items.length) { active = (active - 1 + items.length) % items.length; paintActive(); } }
  else if (e.key === "Enter") { e.preventDefault(); if (items[active]) choose(items[active]); }
  else if (e.key === "Escape") { closeDropdown(); }
});
dd.addEventListener("mousedown", e => {
  const el = e.target.closest(".opt"); if (!el) return;
  e.preventDefault(); choose(items[+el.dataset.i]);
});
dd.addEventListener("mousemove", e => {
  const el = e.target.closest(".opt"); if (el && +el.dataset.i !== active) { active = +el.dataset.i; paintActive(); }
});
document.addEventListener("click", e => { if (!$("combo").contains(e.target)) closeDropdown(); });
$("clear").addEventListener("click", () => {
  input.value = ""; closeDropdown(); $("clear").classList.add("hidden"); input.focus();
  if (new URLSearchParams(location.search).get("master")) goBack(); else showHome();
});
$("home").addEventListener("click", e => {
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0 || !MASTERS.length) return; // new tab / data not loaded → normal link
  e.preventDefault();
  input.value = ""; closeDropdown(); $("clear").classList.add("hidden");
  const url = new URL(location); url.search = "";
  history.pushState({ view: "home" }, "", url);
  filtersOpen = false; expanded.clear();
  showHome();

});

function styleCell(v) {
  const code = clean(v).toUpperCase();
  if (!code) return "-";
  const [label, full] = STYLE[code] || [code, ""];
  const inner = `<span class="code">${esc(code)}</span>${label !== code ? esc(label) : ""}`;
  return full ? `<span class="tip" tabindex="0" data-tip="${esc(code + " = " + full)}">${inner}</span>` : inner;
}

// ---------- tooltip: hover on desktop, tap on mobile ----------
const tipbox = $("tipbox");
let tipOwner = null;
let tipShownAt = 0;
function showTip(el) {
  if (tipOwner !== el) tipShownAt = Date.now();
  tipOwner = el;
  tipbox.textContent = el.dataset.tip;
  tipbox.classList.remove("hidden");
  const r = el.getBoundingClientRect(), b = tipbox.getBoundingClientRect();
  let left = Math.min(Math.max(8, r.left), window.innerWidth - b.width - 8);
  let top = r.bottom + 8;
  if (top + b.height > window.innerHeight - 8) top = r.top - b.height - 8;
  tipbox.style.left = left + "px"; tipbox.style.top = top + "px";
}
function hideTip() { tipOwner = null; tipbox.classList.add("hidden"); }
// hover only for a real mouse; touch screens use tap (click) below
document.addEventListener("pointerover", e => { if (e.pointerType !== "mouse") return; const t = e.target.closest(".tip"); if (t) showTip(t); });
document.addEventListener("pointerout",  e => { if (e.pointerType !== "mouse") return; if (e.target.closest(".tip") && !e.relatedTarget?.closest?.(".tip")) hideTip(); });
document.addEventListener("focusin",   e => { const t = e.target.closest(".tip"); if (t) showTip(t); });
document.addEventListener("focusout",  e => { if (e.target.closest(".tip")) hideTip(); });
document.addEventListener("click", e => {
  const t = e.target.closest(".tip");
  if (!t) return hideTip();
  // a tap fires mouseover/focus first, so only close if the tip was already open before this tap
  if (tipOwner === t && !tipbox.classList.contains("hidden") && Date.now() - tipShownAt > 400) { t.blur(); hideTip(); }
  else showTip(t);
});
window.addEventListener("scroll", hideTip, true);

// ---------- FX hedging: short label, full text on hover ----------
function fxShort(v) {
  const s = clean(v); if (!s) return "-";
  const t = s.toLowerCase();
  if (t.includes("ไม่ป้องกัน") || t.includes("unhedged")) return "ไม่ป้องกัน";
  if (t.includes("ทั้งหมด") || t.includes("fully")) return "ป้องกันทั้งหมด";
  if (t.includes("ดุลยพินิจ") || t.includes("dynamic")) return "ดุลยพินิจ";
  if (t.includes("บางส่วน") || t.includes("partial")) return "บางส่วน";
  return s.split("(")[0].trim() || s;
}

function choose(it) {
  const m = it.type === "master" ? it.m : it.f.master;
  const highlightAbbr = it.type === "fund" ? it.f.abbr : null;
  input.value = m.name;
  $("clear").classList.remove("hidden");
  closeDropdown();
  if (window.matchMedia("(pointer: coarse)").matches) input.blur();
  const url = new URL(location); url.search = "?" + new URLSearchParams({ master: m.name });

const UNTAGGED = { asset: ["Untagged"], region: [], countries: [], excludes: [], sector: [], theme: [], style: [], index: [], mgmt: [], bond_type: [], conf: "" };

function csvRows(text) {
  // small RFC-4180 parser: quoted fields may contain commas, quotes ("") and newlines
  const out = []; let row = [], f = "", q = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { f += '"'; i++; }
      else if (c === '"') q = false;
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(f); f = ""; if (row.some(Boolean)) out.push(row); row = [];
    } else f += c;
  }
  row.push(f); if (row.some(Boolean)) out.push(row);
  return out;
}
function parseTags(text) {
  const [hdr, ...rows] = csvRows(text);
  const ix = Object.fromEntries(hdr.map((h, i) => [h.trim(), i]));
  if (ix.master_fund == null) return;
  rows.forEach(r => {
    const t = { conf: (r[ix.conf] || "").trim() };
    TAG_COLS.forEach(c => t[c] = String(r[ix[c]] ?? "").split(";").map(s => s.trim()).filter(Boolean));
    TAGS.set(norm(r[ix.master_fund]), t);
  });
}

// ---------- history: Back returns to the same filters and scroll position ----------
function goBack() {
  if (history.state && history.state.view === "master" && history.state.fromHome) history.back();
  else { input.value = ""; $("clear").classList.add("hidden"); const url = new URL(location); url.search = "";
         history.pushState({ view: "home" }, "", url); showHome(); }
}
window.addEventListener("popstate", () => {
  const p = new URLSearchParams(location.search).get("master");
  const m = p && MASTER_BY_KEY.get(norm(p));
  if (m) { input.value = m.name; $("clear").classList.remove("hidden"); showMaster(m, null); }
  else { input.value = ""; $("clear").classList.add("hidden"); closeDropdown(); showHome(); }
});

// ---------- similar master funds (for comparing) ----------
// same index tracked > same market + theme > same market or theme; asset class must match unless the index is the same
let MK_SIZE = null;
const mkSize = v => {
  if (!MK_SIZE) { MK_SIZE = new Map(); MASTERS.forEach(o => { if (!o.cat) categorize(o); o.cat.mk.forEach(k => MK_SIZE.set(k, (MK_SIZE.get(k) || 0) + 1)); }); }
  return MK_SIZE.get(v) || 0;
};
function similar(m, limit = 6) {
  if (!m.cat) categorize(m);
  const t = m.tag; if (t === UNTAGGED) return [];
  const myIx = t.index.map(normIndex);
  const out = [];
  for (const o of MASTERS) {
    if (o === m) continue;
    if (!o.cat) categorize(o);
    const u = o.tag, why = [];
    let sc = 0;
    const sameIx = myIx.length && u.index.some(i => myIx.includes(normIndex(i)));
    if (sameIx) { sc += t.mgmt[0] === "Passive" && u.mgmt[0] === "Passive" ? 100 : 45; why.push("ดัชนีเดียวกัน"); }
    if (u.asset[0] !== t.asset[0] && !sameIx) continue;
    const mk = o.cat.mk.filter(v => m.cat.mk.includes(v));
    // most specific shared market first (e.g. "จีน H-shares" before "จีน (ทั้งหมด)")
    const specific = mk.filter(v => !["global", "dm"].includes(v)).sort((a, b) => mkSize(a) - mkSize(b));
    if (specific.length) { sc += 25 + 8 * (specific.length - 1); why.push(optLabel("mk", specific[0])); }
    else if (mk.length) sc += 8;
    const th = o.cat.th.filter(v => m.cat.th.includes(v));
    if (th.length) { sc += 20 * th.length; why.push(...th.map(v => optLabel("th", v))); }
    const exact = u.theme.filter(v => t.theme.includes(v)).length;
    sc += 6 * exact;
    const bt = u.bond_type.filter(v => t.bond_type.includes(v));
    if (bt.length) { sc += 12 * bt.length; why.push(bt[0]); }
    if (!specific.length && !th.length && !sameIx && !bt.length) continue;   // only "global equity" in common is not similar enough
    sc += 4 * u.style.filter(v => t.style.includes(v)).length;   // e.g. both large-cap
    if (u.mgmt[0] === t.mgmt[0]) sc += 3;
    out.push({ o, sc, why: [...new Set(why)].slice(0, 3) });
  }
  return out.sort((a, b) => b.sc - a.sc || b.o.projects - a.o.projects).slice(0, limit);
}
function similarHtml(m) {
  const list = similar(m);
  if (!list.length) return "";
  return `<div class="similar"><h3>Master fund ที่ใกล้เคียง</h3>
    <p class="small">ไว้เทียบทางเลือก เรียงจากใกล้เคียงที่สุด: ดัชนีเดียวกัน › ตลาดและธีมเดียวกัน</p>
    <ul class="top-list">${list.map(({ o, why }) => `<li><button data-k="${esc(norm(o.name))}">
      <span class="nm"><span class="mn">${esc(o.name)}</span>${rowTags(o)}
      <span class="why">${why.map(w => `<span>${esc(w)}</span>`).join("")}</span></span>
      <span class="count" title="จำนวนกองทุนไทยที่ลงทุน">${o.projects} กอง</span></button></li>`).join("")}</ul></div>`;
}

function showMaster(m, hitAbbr) {
  const byProj = new Map();
  for (const r of m.rows) {
    const k = r.proj_id || r.proj_abbr_name;
    if (!byProj.has(k)) byProj.set(k, { r, classes: [] });
    byProj.get(k).classes.push(r);
  }
  const projects = [...byProj.values()].sort((a, b) =>
    amcAbbr(a.r.comp_name_th).localeCompare(amcAbbr(b.r.comp_name_th)) || String(a.r.proj_abbr_name).localeCompare(String(b.r.proj_abbr_name)));

  const rowsHtml = projects.map(({ r, classes }) => {
    const classLines = classes.map(c => {
      return `<div class="cls" title="${esc(clean(c.fund_class_description))}">${esc(clean(c.Search_Name) || clean(c.proj_abbr_name))}</div>`;
    }).join("");
    const fxFull = clean(r.exchange_rate_protection_policy);
    const hit = hitAbbr && clean(r.proj_abbr_name) === hitAbbr ? ' class="hit"' : "";
    return `<tr${hit}>
      <td class="c-fund"><div class="abbr">${esc(r.proj_abbr_name)}</div><div class="small">${esc(r.proj_name_th)}</div></td>
      <td class="c-amc" data-label="บลจ."><span class="amc" title="${esc(r.comp_name_th)}">${esc(amcAbbr(r.comp_name_th))}</span></td>
      <td class="c-cls" data-label="Class">${classLines}</td>
      <td class="c-st" data-label="กลยุทธ์ลงทุน">${styleCell(r.management_style)}</td>
      <td class="c-fx" data-label="นโยบายค่าเงิน">${esc(fxShort(fxFull))}</td>
    </tr>`;
  }).join("");

  const variants = [...m.variants].filter(v => v !== m.name);
  $("result").innerHTML = `<div class="card detail">
    <h2><a class="ext" href="https://www.google.com/search?q=${encodeURIComponent(m.name)}" target="_blank" rel="noopener"
         title="ค้นหาข้อมูลกองทุนหลักใน Google (เปิดแท็บใหม่)">${esc(m.name)}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a></h2>
    ${m.countries.size ? `<div class="meta">กองทุนหลักจดทะเบียนที่ ${esc([...m.countries].join(", "))}</div>` : `<div class="meta"></div>`}
    ${tagChips(m)}
    <div class="toolbar">
      <button class="btn" type="button" data-back="1">← กลับไปรายการ</button>
      <button class="btn" id="copy">คัดลอกชื่อกอง</button>
    </div>
    <div class="table-scroll"><table>
      <thead><tr><th class="c-fund">ชื่อกองทุน</th><th class="c-amc">บลจ.</th><th class="c-cls">Class</th><th class="c-st">กลยุทธ์ลงทุน</th><th class="c-fx">นโยบายค่าเงิน</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>
    ${similarHtml(m)}
    ${variants.length ? `<div class="variants">ชื่อ master fund ตามที่แต่ละ บลจ. ระบุใน SEC:<ul>${variants.map(v => `<li>${esc(v)}</li>`).join("")}</ul></div>` : ""}
  </div>`;

  $("copy").addEventListener("click", e => {
    navigator.clipboard.writeText(projects.map(p => p.r.proj_abbr_name).join("\n")).then(() => {
      e.target.textContent = "คัดลอกแล้ว"; setTimeout(() => e.target.textContent = "คัดลอกชื่อกอง", 1500);
    });
  });
}
</script>
